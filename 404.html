<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>404 — Abdessamad Ait Taghzant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f9fd;--card:#fff;--ink:#082b5b;--muted:#6b8194;--line:#dce7f1;--blue:#1687d8}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;transition:.3s}
body.dark{--bg:#07111d;--card:#0d1d31;--ink:#f2f7ff;--muted:#a9bdd0;--line:#1e3a57;--blue:#31a7ff}
.bg{position:fixed;inset:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.16;background:var(--blue)}
.o1{width:420px;height:420px;right:-100px;top:-130px}.o2{width:280px;height:280px;left:-90px;bottom:-70px}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(22,135,216,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(22,135,216,.06) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent)}
.top{position:fixed;top:0;left:0;right:0;padding:25px 6%;display:flex;justify-content:space-between;align-items:center;z-index:5}
.logo{font-weight:900;letter-spacing:1px;color:var(--ink)}.logo span{color:var(--blue)}
.actions{display:flex;gap:8px}.actions button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 13px;font-weight:900;cursor:pointer}
.actions button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.wrap{min-height:100vh;display:grid;place-items:center;padding:90px 20px 40px;position:relative;z-index:2}
.card{text-align:center;max-width:800px}
.code{font-size:clamp(130px,25vw,260px);line-height:.75;font-weight:1000;letter-spacing:-18px;color:transparent;-webkit-text-stroke:3px var(--blue);text-shadow:0 0 35px rgba(22,135,216,.18);position:relative}
.code:after{content:"404";position:absolute;inset:0;color:var(--blue);opacity:.08;-webkit-text-stroke:0;transform:translate(8px,8px)}
.badge{display:inline-flex;margin:38px 0 16px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--blue);font-size:11px;font-weight:900;letter-spacing:2px}
h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin-bottom:15px}p{color:var(--muted);max-width:590px;margin:0 auto;font-size:16px}
.buttons{margin-top:30px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.btn{padding:14px 20px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:900;text-decoration:none;transition:.25s}
.btn.primary{background:linear-gradient(135deg,#075fae,#1687d8);color:#fff;border:0}.btn:hover{transform:translateY(-3px)}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--blue);animation:float 4s ease-in-out infinite}
.s1{left:16%;top:27%}.s2{right:17%;top:35%;animation-delay:1s}.s3{right:28%;bottom:20%;animation-delay:2s}
@keyframes float{50%{transform:translateY(-20px);opacity:.4}}
@media(max-width:600px){.top{padding:20px}.logo{font-size:13px}.code{letter-spacing:-10px}}
</style>
</head>
<body>
<div class="bg"><div class="grid"></div><div class="orb o1"></div><div class="orb o2"></div></div>
<header class="top">
 <div class="logo">ABDESSAMAD <span>AIT TAGHZANT</span></div>
 <div class="actions">
   <button id="fr" class="active">FR</button><button id="en">EN</button><button id="theme">☾</button>
 </div>
</header>
<main class="wrap">
 <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>
 <section class="card">
   <div class="code">404</div>
   <div class="badge" data-fr="● PAGE INTROUVABLE" data-en="● PAGE NOT FOUND">● PAGE INTROUVABLE</div>
   <h1 data-fr="Oups… cette page s’est perdue dans le design." data-en="Oops… this page got lost in the design.">Oups… cette page s’est perdue dans le design.</h1>
   <p data-fr="Le lien que vous avez suivi n’existe pas ou a été déplacé. Revenez au portfolio pour découvrir mes créations." data-en="The link you followed does not exist or may have moved. Return to my portfolio to discover my work.">Le lien que vous avez suivi n’existe pas ou a été déplacé. Revenez au portfolio pour découvrir mes créations.</p>
   <div class="buttons">
     <a class="btn primary" href="index.html" data-fr="← Retour à l’accueil" data-en="← Back to home">← Retour à l’accueil</a>
     <a class="btn" href="index.html#portfolio" data-fr="Voir le portfolio →" data-en="View portfolio →">Voir le portfolio →</a>
   </div>
 </section>
</main>
<script>
const fr=document.getElementById('fr'), en=document.getElementById('en'), theme=document.getElementById('theme');
function setLang(l){
 document.documentElement.lang=l;
 document.querySelectorAll('[data-fr]').forEach(x=>x.textContent=x.dataset[l]);
 fr.classList.toggle('active',l==='fr'); en.classList.toggle('active',l==='en');
 localStorage.setItem('portfolio-language',l);
}
fr.onclick=()=>setLang('fr'); en.onclick=()=>setLang('en');
setLang(localStorage.getItem('portfolio-language')||'fr');
function themeIcon(){theme.textContent=document.body.classList.contains('dark')?'☀':'☾'}
if(localStorage.getItem('portfolio-theme')==='dark')document.body.classList.add('dark');
themeIcon();
theme.onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('portfolio-theme',document.body.classList.contains('dark')?'dark':'light');themeIcon()}
</script>
</body>
</html>
